name: Backup D1

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar variables necesarias
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN en GitHub Secrets (Settings > Secrets and variables > Actions)."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_ACCOUNT_ID en GitHub Secrets (Settings > Secrets and variables > Actions)."
            missing=1
          fi
          if [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "::error::Falta el secreto BACKUP_ENCRYPTION_KEY en GitHub Secrets; sin él no se genera ningún backup."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Secretos requeridos presentes (los valores no se imprimen)."

      - name: Fecha del día
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Comprobar Python para la validación
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::error::python3 no está disponible en el runner; no se puede validar el SQL del backup."
            exit 1
          fi
          python3 --version

      - name: Crear directorio de backups
        run: mkdir -p backups

      - name: Exportar D1 (remoto)
        run: npm run backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Validar artefacto de backup
        run: |
          if [ ! -f backups/backup.sql ]; then
            echo "::error::No se ha generado backups/backup.sql"
            exit 1
          fi
          if ! python3 scripts/validate-d1-backup.py backups/backup.sql --require-table appointments; then
            echo "::error::La validación del backup ha fallado; no se subirá ningún artefacto."
            exit 1
          fi

      - name: Cifrar backup
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "::error::Falta el secreto BACKUP_ENCRYPTION_KEY"
            exit 1
          fi
          node scripts/encrypt-backup.mjs backups/backup.sql --out backups/backup.sql.enc

      - name: Verificar descifrado antes de publicar
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          node scripts/decrypt-backup.mjs backups/backup.sql.enc --out "$RUNNER_TEMP/restore-check.sql"
          if ! cmp -s backups/backup.sql "$RUNNER_TEMP/restore-check.sql"; then
            echo "::error::El SQL descifrado no coincide con el original; no se publica el artefacto."
            exit 1
          fi
          echo "Descifrado verificado: el artefacto cifrado se puede recuperar."

      - name: Subir el backup cifrado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ steps.date.outputs.date }}
          path: backups/backup.sql.enc
          if-no-files-found: error
          retention-days: 30

      - name: Limpiar archivos temporales
        if: always()
        run: |
          rm -f backups/backup.sql backups/backup.sql.enc "$RUNNER_TEMP/restore-check.sql"
          echo "Temporales eliminados (SQL en claro y copia de verificación)."
